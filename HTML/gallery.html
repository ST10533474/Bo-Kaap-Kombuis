<header>
    <nav>
        <img src="../Images/logo/logo.webp"
             alt="Bo-Kaap Kombuis restaurant logo"
             class="logo">

    <h1>Bo-Kaap Kombuis</h1>

    <button class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"

<main>

<section class="page-header">
    <h2>Our Gallery</h2>

<p>
    Explore the flavours, food and colourful cultural
    atmosphere of Bo-Kaap Kombuis.
</p>

</section>

<section class="gallery">

<h2>Food and Cultural Experience</h2>

<div class="gallery-grid">

    <figure class="gallery-item">
        <img
            src="../Images/gallery/gallery1-medium.webp"
            srcset="../Images/gallery/gallery1-small.webp 480w,
                    ../Images/gallery/gallery1-medium.webp 800w,
                    ../Images/gallery/gallery1-large.webp 1200w"
            sizes="(max-width: 600px) 100vw, (max-width: 900px) 50vw, 33vw"
            alt="Colourful buildings and surroundings in the Bo-Kaap"
            loading="lazy"
            decoding="async"
            data-lightbox="gallery">

        <figcaption>Bo-Kaap Cultural Experience</figcaption>
    </figure>

    <figure class="gallery-item">
        <img
            src="../Images/gallery/gallery2-medium.webp"
            srcset="../Images/gallery/gallery2-small.webp 480w,
                    ../Images/gallery/gallery2-medium.webp 800w,
                    ../Images/gallery/gallery2-large.webp 1200w"
            sizes="(max-width: 600px) 100vw, (max-width: 900px) 50vw, 33vw"
            alt="Restaurant surroundings in the Bo-Kaap"
            loading="lazy"
            decoding="async"
            data-lightbox="gallery">

        <figcaption>Bo-Kaap Restaurant Atmosphere</figcaption>
    </figure>

    <figure class="gallery-item">
        <img
            src="../Images/gallery/gallery3-medium.webp"
            srcset="../Images/gallery/gallery3-small.webp 480w,
                    ../Images/gallery/gallery3-medium.webp 800w,
                    ../Images/gallery/gallery3-large.webp 1200w"
            sizes="(max-width: 600px) 100vw, (max-width: 900px) 50vw, 33vw"
            alt="Cape Malay food and dining experience"
            loading="lazy"
            decoding="async"
            data-lightbox="gallery">

        <figcaption>Cape Malay Dining Experience</figcaption>
    </figure>

    <figure class="gallery-item">
        <img
            src="../Images/food/cape-malay-food1.webp"
            alt="Traditional Cape Malay cuisine served at Bo-Kaap Kombuis"
            loading="lazy"
            decoding="async"
            data-lightbox="gallery">

        <figcaption>Cape Malay Cuisine</figcaption>
    </figure>

    <figure class="gallery-item">
        <img
            src="../Images/food/cape-malay-food2.jpg"
            alt="Traditional Cape Malay dish prepared with aromatic spices"
            loading="lazy"
            decoding="async"
            data-lightbox="gallery">

        <figcaption>Traditional Cape Malay Dish</figcaption>
    </figure>

    <figure class="gallery-item">
        <img
            src="../Images/food/cape-malay-food3.webp"
            alt="Prepared Cape Malay meal"
            loading="lazy"
            decoding="async"
            data-lightbox="gallery">

        <figcaption>Traditional Flavours</figcaption>
    </figure>

</div>

</section>
